# mpv keys: defaults plus vim-style seeking. install.sh links this directory to ~/.config/mpv/.
# Defaults worth knowing: space pause, [ ] speed -/+10%, { } half/double, BS normal speed,
# j/J subtitles, v hide subs, o progress, i stats, s screenshot, q quit (Q: forget position).

# h/l seek 5s, H/L a minute (exact, so rewinding a sentence lands where you expect).
# l and L were A-B loop and loop-file: moved to a and A (A was aspect override, rarely needed).
h seek -5 exact
l seek  5 exact
H seek -60
L seek  60
a ab-loop
A cycle-values loop-file "inf" "no"

# mpv: keyboard-only player for local files and YouTube (qutebrowser ,m / ;m sends links here).
# install.sh links this directory to ~/.config/mpv/. Keys: input.conf.

# Window: no title bar and no forced aspect, so AeroSpace can tile it like any other window;
# open at once, even before a stream has loaded or for audio-only files
force-window=immediate
border=no
keepaspect-window=no
background-color='#141415'
autofit-larger=90%x90%
# stay on the last frame instead of closing (and losing your place) at the end
keep-open=yes
# come back to where you left off, also in YouTube videos
save-position-on-quit=yes

vo=gpu-next
hwdec=auto-safe

# YouTube via yt-dlp: 1080p is plenty on a 13" screen and saves bandwidth. Full path because
# mpv started from qutebrowser/the Dock has launchd's bare PATH.
ytdl-format=bestvideo[height<=?1080]+bestaudio/best
script-opts=ytdl_hook-ytdl_path=/opt/homebrew/bin/yt-dlp
# buffer ahead so seeking around a lecture doesn't stall
cache=yes
demuxer-max-bytes=256MiB
demuxer-readahead-secs=60

# Subtitles: load matching files next to the video, English first
sub-auto=fuzzy
slang=en,eng
alang=en,eng,ja,jpn

# No on-screen controller (mouse UI); seeking shows a thin bar + time (o shows it any time)
osc=no
osd-on-seek=msg-bar
osd-duration=1500
osd-font='JetBrainsMono Nerd Font'
osd-font-size=30
osd-color='#cdcdcd'
osd-border-color='#141415'
osd-border-size=2
osd-bar-align-y=0.95
osd-bar-h=1.5
osd-bar-w=60
osd-selected-color='#f3be7c'
osd-playing-msg='${media-title}'

volume=80
volume-max=150

screenshot-directory=~/Screenshots
screenshot-format=png
screenshot-template='%F-%wH%wM%wS'

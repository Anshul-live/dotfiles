# aerc: mail (Gmail over IMAP), window "mail" of the tmux session "comms" (bin/ws-session).
# On macOS aerc reads ~/Library/Preferences/aerc/ (no XDG_CONFIG_HOME here); install.sh links
# this file, binds.conf and stylesets/ there and copies accounts.conf.example -> accounts.conf.
# Only non-defaults; see `man aerc-config`.

[general]
# fuzzy pickers for :menu (folders, links, attachments)
default-menu-cmd = fzf --height 100% --layout reverse --no-info
# accounts.conf keeps aerc's 0600 check: it's a local copy, not a link into the repo

[ui]
styleset-name = vague
# 13": a narrow folder list, short dates, threads like Gmail's conversations
sidebar-width = 18
index-columns = flags:4,name<15%,subject,date>*
timestamp-format = 02 Jan 06
this-day-time-format = 15:04
this-week-time-format = Mon 15:04
this-year-time-format = 02 Jan
threading-enabled = true
fuzzy-complete = true
mouse-enabled = true
next-message-on-delete = true
border-char-vertical = "│"
border-char-horizontal = "─"
spinner = "◜,◠,◝,◞,◡,◟"

[viewer]
pager = less -Rc
# plain text first; HTML-only mail goes through the w3m filter below
alternatives = text/plain,text/html
header-layout = From|To,Cc|Bcc,Date,Subject
show-headers = false

[compose]
# $EDITOR (nvim) in aerc's own terminal
empty-subject-warning = true
no-attachment-warning = ^[^>]*\b(attach(ed|ment)|attaching)\b
file-picker-cmd = fd -t f . ~ | fzf --multi --height 100% --layout reverse

[filters]
text/plain = colorize
text/calendar = calendar
message/delivery-status = colorize
message/rfc822 = colorize
# aerc's bundled w3m script, network blocked (no tracking pixels); dumped as text so links
# show up for <C-l> :open-link. `! html` instead would give w3m's interactive pager.
text/html = html | colorize
.headers = colorize

[openers]
# links and HTML parts -> qutebrowser (absolute: tmux may not carry ~/.local/bin on PATH)
x-scheme-handler/http* = $HOME/.local/bin/qb {}
text/html = $HOME/.local/bin/qb {}
application/pdf = open -a "$HOME/Applications/sioyek.app" {}
video/* = mpv --really-quiet {}
# anything else: macOS `open` (aerc's default)

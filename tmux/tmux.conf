##### Core Behavior #####

# Unbind default prefix
unbind C-b

# Set prefix
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"
bind ? display-popup -E "tmux list-keys | less"

# Projects: prefix + f -> fuzzy-pick a project, jump into (or create) its session
bind f display-popup -E -w 60% -h 50% -b single -S "fg=#606079" "~/.local/bin/tmux-sessionizer"
# prefix + Tab -> back to the previous session
bind Tab switch-client -l

# Indexing starts at 1
set -g base-index 1
setw -g pane-base-index 1

# Faster escape response
set -sg escape-time 0

# True color
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"
# copy from tmux/nvim reaches the macOS clipboard (OSC 52, Ghostty allows it)
set -g set-clipboard on
# let nvim know when its pane gains focus (reloads files changed outside, e.g. by Claude)
set -g focus-events on
# pass cursor color/shape through (nvim colors the cursor by mode)
set -as terminal-features ",*:ccolour:cstyle"
# images inside tmux (yazi previews, spotify_player cover art): let the kitty graphics
# protocol through, and keep TERM_PROGRAM so apps can tell they're in Ghostty
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Scrollback
set -g history-limit 50000


##### Splits #####

# Vertical / horizontal splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


##### Windows #####

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Window navigation
bind -r n next-window
bind -r p previous-window


##### Copy Mode #####

setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel


##### Status Bar #####

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 2

# Main bar style
set -g status-style "bg=#141415,fg=#cdcdcd"

# Prevent inherited weirdness
set -g status-left-style "none"
set -g status-right-style "none"

# Left section
set -g status-left-length 50
set -g status-left "#[fg=#6e94b2,bold] #S "

# Window tabs
setw -g window-status-format "#[fg=#606079]  #I:#W  "
setw -g window-status-current-format "#[bg=#6e94b2,fg=#141415,bold]  #I:#W  "

# Right section
set -g status-right-length 100
set -g status-right "#[fg=#7fa563] %H:%M #[fg=#f3be7c]| %d-%b #[fg=#6e94b2]| #(whoami) "

# Messages
set -g message-style "bg=#f3be7c,fg=#141415,bold"

# Pane borders
set -g pane-border-style "fg=#606079"
set -g pane-active-border-style "fg=#6e94b2"

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off


##### Vim Navigation #####

# Smart pane switching with vim awareness (smart-splits.nvim sets @pane-is-vim)
bind-key -n C-h if -F "#{@pane-is-vim}" "send-keys C-h" "select-pane -L"
bind-key -n C-j if -F "#{@pane-is-vim}" "send-keys C-j" "select-pane -D"
bind-key -n C-k if -F "#{@pane-is-vim}" "send-keys C-k" "select-pane -U"
bind-key -n C-l if -F "#{@pane-is-vim}" "send-keys C-l" "select-pane -R"

# Alt+arrows resize: nvim splits first, then tmux panes
bind-key -n M-Left  if -F "#{@pane-is-vim}" "send-keys M-Left"  "resize-pane -L 3"
bind-key -n M-Down  if -F "#{@pane-is-vim}" "send-keys M-Down"  "resize-pane -D 3"
bind-key -n M-Up    if -F "#{@pane-is-vim}" "send-keys M-Up"    "resize-pane -U 3"
bind-key -n M-Right if -F "#{@pane-is-vim}" "send-keys M-Right" "resize-pane -R 3"

# Navigate back to previous pane
bind-key -n 'C-\' select-pane -l

# Copy mode navigation
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l


##### Plugins #####

set -g @plugin 'tmux-plugins/tpm'

run '~/.tmux/plugins/tpm/tpm'

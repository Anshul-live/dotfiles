# btop: system monitor. install.sh links btop/ -> ~/.config/btop (this file + themes/vague.theme).
# Only non-defaults; btop fills the rest in (see `btop --default-config`).
# save_config_on_exit = false: btop otherwise rewrites this whole file (all ~90 keys) on quit,
# which would keep dirtying the repo. Change settings here, not in btop's menu.
save_config_on_exit = false

# vague (themes/vague.theme); theme_background off = the terminal's own #141415 shows through
color_theme = "vague"
theme_background = false
truecolor = true

vim_keys = true
update_ms = 1000
rounded_corners = true
graph_symbol = "braille"

# 13": cpu/mem/net on top, processes below; 'p' cycles presets (1 = cpu+procs, 2 = cpu+mem+net)
shown_boxes = "cpu mem net proc"
presets = "cpu:0:default,proc:0:default cpu:0:default,mem:0:default,net:0:default"
# one combined cpu graph and no per-disk io graphs: fewer, larger boxes
cpu_single_graph = true
show_io_stat = false
proc_sorting = "cpu lazy"
proc_tree = false
proc_gradient = false
# Apple Silicon: package watts and the battery are worth the space; per-core temps aren't
show_cpu_watts = true
show_coretemp = false
show_battery = true
clock_format = "%H:%M"

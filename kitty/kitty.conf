# =========================
# PERFORMANCE FIRST
# =========================
enable_audio_bell no
visual_bell_duration 0.0
remember_window_size yes
repaint_delay 8
input_delay 2
sync_to_monitor yes
hide_window_decorations yes

# =========================
# WINDOW & LAYOUT
# =========================
window_padding_width 6
window_margin_width 0
draw_minimal_borders yes
confirm_os_window_close 0

# Use background opacity ONLY if you want it
background_opacity 1.0

# =========================
# FONT (CRITICAL)
# =========================
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 15
modify_font cell_height 115%

# Disable ligatures for code clarity
font_features JetBrainsMono Nerd Font -liga -calt

# =========================
# CURSOR
# =========================
cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 0

# =========================
# SCROLLBACK
# =========================
scrollback_lines 20000
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 1.0

# =========================
# COLORS (vague, matches the Neovim colorscheme)
# =========================
foreground #cdcdcd
background #141415

selection_foreground #cdcdcd
selection_background #333738

cursor #cdcdcd
cursor_text_color #141415

color0  #252530
color1  #d8647e
color2  #7fa563
color3  #f3be7c
color4  #6e94b2
color5  #bb9dbd
color6  #aeaed1
color7  #cdcdcd

color8  #606079
color9  #e08398
color10 #99b782
color11 #f5cb96
color12 #8ba9c1
color13 #c9b1ca
color14 #bebeda
color15 #d7d7d7

# =========================
# KEYBINDINGS (SANE)
# =========================
map cmd+enter new_window
map cmd+w close_window
map cmd+shift+d new_window_with_cwd

map cmd+shift+c copy_to_clipboard
map cmd+shift+v paste_from_clipboard

map cmd+k clear_terminal scrollback

# =========================
# TAB BAR (MINIMAL)
# =========================
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_foreground   #141415
active_tab_background   #6e94b2
inactive_tab_foreground #606079
inactive_tab_background #141415

# =========================
# MOUSE (DON’T BE ANNOYING)
# =========================
copy_on_select yes
mouse_hide_wait 3.0

# left Option sends Alt (nvim treewalker / resize keys); right Option still types special chars
macos_option_as_alt left
